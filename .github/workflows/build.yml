name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.task }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        task: [ assembleDebug, assembleRelease, lintDebug, testDebugUnitTest ]
    env:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 23
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 23

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run ${{ matrix.task }}
        shell: bash
        run: ./gradlew ${{ matrix.task }}

      # Dexing outputs whose desugar_graph.bin differs across OSes and changes the
      # :app:app:mergeLibDexDebug cache key.
      - name: Archive dexing outputs
        if: matrix.task == 'assembleDebug'
        uses: actions/upload-artifact@v4
        with:
          name: dexing-outputs-${{ runner.os }}
          if-no-files-found: warn
          path: |
            core/cart/build/.transforms/*/transformed/bundleLibRuntimeToDirDebug
            core/login/build/.transforms/*/transformed/bundleLibRuntimeToDirDebug
            core/message/build/.transforms/*/transformed/bundleLibRuntimeToDirDebug
            core/search/build/.transforms/*/transformed/bundleLibRuntimeToDirDebug
            core/status/build/.transforms/*/transformed/bundleLibRuntimeToDirDebug
            model/metric-identity/build/.transforms/*/transformed/bundleLibRuntimeToDirDebug
            model/todo-identity/build/.transforms/*/transformed/bundleLibRuntimeToDirDebug
            repository/alarm-login/build/.transforms/*/transformed/bundleLibRuntimeToDirDebug
            repository/status-login/build/.transforms/*/transformed/bundleLibRuntimeToDirDebug

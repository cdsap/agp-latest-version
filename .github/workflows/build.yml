name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.task }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        task: [ assembleDebug, assembleRelease, lintDebug, testDebugUnitTest ]
    env:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 23
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 23

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run ${{ matrix.task }}
        shell: bash
        run: ./gradlew ${{ matrix.task }}

      # Dexing outputs whose desugar_graph.bin differs across OSes and changes the
      # :app:app:mergeLibDexDebug cache key, plus a layout file to check checkout
      # line endings (CRLF on Windows).
      - name: Archive dexing outputs
        if: matrix.task == 'assembleDebug'
        uses: actions/upload-artifact@v4
        with:
          name: dexing-outputs-${{ runner.os }}
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            core/cart/build/.transforms/*/transformed/bundleLibRuntimeToDirDebug
            core/login/build/.transforms/*/transformed/bundleLibRuntimeToDirDebug
            core/message/build/.transforms/*/transformed/bundleLibRuntimeToDirDebug
            core/search/build/.transforms/*/transformed/bundleLibRuntimeToDirDebug
            core/status/build/.transforms/*/transformed/bundleLibRuntimeToDirDebug
            model/metric-identity/build/.transforms/*/transformed/bundleLibRuntimeToDirDebug
            model/todo-identity/build/.transforms/*/transformed/bundleLibRuntimeToDirDebug
            repository/alarm-login/build/.transforms/*/transformed/bundleLibRuntimeToDirDebug
            repository/status-login/build/.transforms/*/transformed/bundleLibRuntimeToDirDebug
            core/comment/src/main/res/layout/fragment_feature_comment.xml

  # Same OS as the ubuntu-latest assembleDebug job (4 cores), pinned to 3 cores. AGP
  # dexes into max(cores / 2, 1) buckets, so this one writes 1 bucket instead of 2.
  build-linux-3-cores:
    name: assembleDebug (ubuntu-latest, 3 cores)
    runs-on: ubuntu-latest
    env:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 23
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 23

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Show CPUs
        run: |
          echo "Runner CPUs: $(nproc)"
          echo "Pinned CPUs: $(taskset -c 0-2 nproc)"

      # The CPU affinity is inherited by the Gradle daemon, so
      # Runtime.availableProcessors() returns 3 in the build.
      - name: Run assembleDebug on 3 cores
        run: taskset -c 0-2 ./gradlew assembleDebug -Dscan.tag.linux-3-cores

      - name: Archive dexing outputs
        uses: actions/upload-artifact@v4
        with:
          name: dexing-outputs-Linux-3-cores
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            app/app/build/intermediates/project_dex_archive/debug/dexBuilderDebug/out
            core/forecast/build/.transforms/*/transformed/bundleLibRuntimeToDirDebug
            core/message/build/.transforms/*/transformed/bundleLibRuntimeToDirDebug
            domain/cart-login/build/.transforms/*/transformed/bundleLibRuntimeToDirDebug
            domain/search-login/build/.transforms/*/transformed/bundleLibRuntimeToDirDebug
            model/metric-identity/build/.transforms/*/transformed/bundleLibRuntimeToDirDebug
            repository/article-login/build/.transforms/*/transformed/bundleLibRuntimeToDirDebug
